<div class="container">
  <div class="card artist-card shadow zoom-in-out-on-hover">
    <div class="card-body">
      <div class="profile-pic">
        <img [src]="artist.thumbnail_url" class="profile-picture rounded-circle shadow" alt="Profile Picture">
      </div>
      <div class="artist-detail">
        <p class="card-title"><strong>{{ artist.artist_name }}</strong></p>
        <p class="job-title">{{ artist.artwork_title }}</p>
        
        <div class="row like-creation">
          <div class="col-auto">
            <i class="bi bi-star-fill"></i>
          </div>
          <div class="col">
            <p class="like-count"><strong>{{ formatLikeCount(artist.total_likes) }}</strong></p>
          </div>
        </div>
        <button type="button" class="btn btn-primary mx-auto" (click)="messageArtist(artist.firebase_uid, artist.artist_name  )">Message</button>
      </div>
    </div>
  </div>
</div>
