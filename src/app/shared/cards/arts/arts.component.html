 <!--image card start-->
 <div class="container">
    <div class="image">
        <img [src]="art.thumbnail_url" alt="Artwork Image">
        <div class="details">
            <h2>{{art.artwork_title}}</h2>
            <p>{{art.artist_name}}</p>
           
        
           
        </div>
            <div class="more">
                <p class="price">{{art.price | currency:'USD':'symbol':'1.2-2'}}</p>
                <p class="like-count"><i class="bi bi-heart-fill"></i>{{art.total_likes}}</p>
                <button class="btn cart-icon-btn" (click)="addCart(art)"> <i class="bi bi-cart-plus-fill"></i></button>
            </div>
        </div>
    </div>


  <!--image card end-->
