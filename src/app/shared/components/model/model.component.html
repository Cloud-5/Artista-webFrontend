<div class="canvas-container" style="position: relative; width: 100%; height: 100%;">
  <div *ngIf="loading" id="loader" class="d-flex justify-content-center align-items-center gap-4" style="position: absolute; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.8); z-index: 10;">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p style="font-size: large; margin: 0;">Loading 3D Model...</p>
  </div>
  <canvas #canvas id="canvas" style="width: 100%; height: 100%; margin: 0;"></canvas>
  <button class="btn btn-sm" id="resetButton" style="position: absolute; top: 10px; left: 10px; background-color: rgb(70, 70, 70); color: white; z-index: 11;">Reset Position</button>
  <button class="btn btn-sm" id="fullscreenButton" style="position: absolute; top: 10px; left: 125px; background-color: rgb(70, 70, 70); color: white; z-index: 11;"><i class="bi bi-arrows-fullscreen"></i></button>
</div>
