<form [formGroup]="form" (ngSubmit)="onSubmit()" class="comment-form">
  <div class="row">
    <textarea class="form-control comment-area" formControlName="title" placeholder="Join The Discussion..."></textarea>
  </div>
  <div class="row">
    <div class="col d-flex justify-content-end">
      <button class="btn write-btn" type="submit" [disabled]="form.invalid">
        {{ submitLabel }}
      </button>
      &nbsp;&nbsp;
      <button
        *ngIf="hasCancelButton"
        type="button"
        class="btn write-btn"
        (click)="handleCancel.emit()"
      >
        Cancel
      </button>
    </div>
  </div>
</form>
