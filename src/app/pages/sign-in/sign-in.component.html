

<!-- <div class="ss "> -->
 <div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      <img src="../../../assets/ArtistaLogo.jpg" alt="ARTISTA Logo">
    </div>
    <div class="col-md-6 mt-4">
      <div class="card">
        <div class="card-body">
          <div class="sign-in-container">
            <form [formGroup]="loginForm" (ngSubmit)="signIn()">
              <h1>Sign In</h1>
              <br><br>
              <div class="mb-3">
                <label for="inputEmail" class="form-label">Email address</label>
                <input type="email" id="inputEmail" formControlName="email" class="form-control" placeholder="Enter your Email">
                <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')" class="text-danger">Please enter a valid email</div>
              </div>
              <div class="mb-3">
                <label for="inputPassword" class="form-label">Password</label>
                <input type="password" id="inputPassword" formControlName="password" class="form-control" placeholder="Password">
                <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')" class="text-danger">Password is required</div>
              </div>
              <br>
              <div class="mb-3 row">
                <div class="d-flex justify-content-start col-6">
                  <a routerLink="/reset">Forget password?</a>
                </div>
                <div class="d-flex justify-content-end col-6">
                  <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Sign In</button>
                </div>
              </div>
              <br><br><br><br><br>
              <div class="mb-3">
                <a href="#">New User?</a>
                <a href="#">Get help for signing In</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
