
<div class="ss">

<div class="container" id="container">
        
  <div class="form-container sign-in">
      <form [formGroup]="loginForm" (ngSubmit)="signIn()">
          <!-- Error and success messages -->
          <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>
            <div *ngIf="Message" class="alert alert-success" role="alert">
              {{ Message }}
            </div>
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              {{ successMessage }}
            </div>
          <h1>Sign In</h1>
        
         <div class="social-icons">
          <!-- google auth -->
       </div>
          <input type="email" id="inputEmail" formControlName="email" class="form-control" placeholder=" Email">
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">Please enter a valid email</div>
   
          <input type="password" id="inputPassword" formControlName="password" class="form-control" placeholder="Password">
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">Password is required</div>
       
          
        <div class="g-recaptcha"  id="recaptcha" data-sitekey="6Lc-0gQqAAAAAJij1oo6f5MHKhs67mj0gzar6ocw"></div>
       
          <a routerLink="/reset">Forget Your Password?</a>
       
          <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Sign In</button>
      </form>
  </div>
  <div class="toggle-container">
      <div class="toggle">
          <div class="toggle-panel toggle-right">
            <img class="image" src="../../../assets/logo5.jpg" alt="ARTISTA Logo" style="width: 250px; height: 250px;">
          </div>
      </div>
  </div>
</div>
</div>
