<div class="ss">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <img src="../../../assets/ArtistaLogo.jpg" alt="ARTISTA Logo">
      </div>
      <div class="col-md-6 mt-1 p-4">
        <div class="card">
          <div class="card-body">
            <div class="sign-in-container">
              <form class="row g-3" [formGroup]="signupForm" (submit)="createAccount()">
                <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                  {{ errorMessage }}
                </div>
                <div *ngIf="Message" class="alert alert-success" role="alert">
                  {{ Message }}
                </div>
                <p>Step 2 of 2</p>
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input type="text" class="form-control" formControlName="fName">
                  <div *ngIf="signupForm.get('fName')?.invalid && signupForm.get('fName')?.touched" class="text-danger">
                    First Name is required
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input type="text" class="form-control" formControlName="lName">
                  <div *ngIf="signupForm.get('lName')?.invalid && signupForm.get('lName')?.touched" class="text-danger">
                    Last Name is required
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" class="form-control" formControlName="dob">
                  <div *ngIf="signupForm.get('dob')?.invalid && signupForm.get('dob')?.touched" class="text-danger">
                    Date of Birth is required
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Location</label>
                  <input type="text" class="form-control" formControlName="location">
                  <div *ngIf="signupForm.get('location')?.invalid && signupForm.get('location')?.touched" class="text-danger">
                    Location is required
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Role</label>
                  <select class="form-select" formControlName="role">
                    <option value="" disabled selected>Select your role</option>
                    <option value="artist">Artist</option>
                    <option value="enthusiast">Customer</option>
                  </select>
                  <div *ngIf="signupForm.get('role')?.invalid && signupForm.get('role')?.touched" class="text-danger">
                    Role is required
                  </div>
                </div>
                <p>By clicking create account... <a href="">Terms of use</a> & <a href="">privacy policy</a></p>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary" [disabled]="signupForm.invalid">Create Account</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
