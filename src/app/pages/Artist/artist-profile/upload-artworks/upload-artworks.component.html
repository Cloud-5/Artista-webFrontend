<app-navbar></app-navbar>
<div class="main">
  <div class="container-fluid ">
    <div class="row">
      <div class="col-sm-6 col-md-7 p-0">
        <img src="../../../../../assets/imgs/art.jpg" class="left-image">
      </div>
      <div class="col-sm-6 col-md-5 intro-section ">
        <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
          <div class="input-group mb-3">
            <input type="file" class="form-control input-area" id="inputGroupFile02" (change)="onFileSelect($event)">
            <label class="input-group-text btn-custom" for="inputGroupFile02">Choose File</label>
          </div>
          <div *ngIf="fileName" class="file-name">{{ fileName }}</div>

          <div class="form-group">
            <label for="title">Artwork Title</label>
            <input type="text" id="title" formControlName="title" class="form-control input-area">
          </div>

          <!-- <div class="form-group">
            <label for="keywords">Keywords</label>
            <input type="text" id="keywords" formControlName="keywords" class="form-control">
          </div> -->

          <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" formControlName="price" class="form-control input-area">
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" formControlName="category" class="form-control input-area">
              <option value="3d">3D Art</option>
              <option value="2d">2D Art</option>
              <option value="anime">Anime</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" formControlName="description" class="form-control input-area"></textarea>
          </div>

          <div class="form-group">
            <label for="tags">Tags</label>
            <input type="text" id="tags" formControlName="tags" class="form-control input-area" placeholder="Comma-separated tags">
          </div>

          <div class="form-group d-flex justify-content-between">
            <button type="submit" class="btn btn-custom " [disabled]="isUploading">Upload Artwork</button>
            <button type="button" class="btn btn-custom">Cancel</button>
          </div>

          <div *ngIf="isUploading" class="uploading-animation">Uploading...</div>
        </form>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
