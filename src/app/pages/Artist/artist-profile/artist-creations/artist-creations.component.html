  <div class="container">
    <div class="row">
      <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let artwork of artworks">
        <div class="card p-0 category-card">
          <div class="card-image">
            <img [src]="artwork.thumbnail_url" class="card-img-top" alt="{{artwork.title}}">
          </div>
          <div class="card-body card-content d-flex flex-column align-items-center">
            <div class="card-details d-flex justify-content-between w-100">
              <div class="price"><strong>${{artwork.price}}</strong></div>
              <div class="title"><strong>{{artwork.title}}</strong></div>
            </div>
            <div class="card-stats d-flex justify-content-between w-100 mt-2">
              <div class="artist-name"><strong>{{artwork.artistName}}</strong></div>
              <div class="purchase-count"><strong>Purchased: {{artwork.purchaseCount}}</strong></div>
            </div>
            <div class="card-stats d-flex justify-content-between w-100 mt-2">
              <button type="button" class="btn btn-success btn-sm" style="width: fit-content;">
                <i class="bi bi-hand-thumbs-up"></i>
              </button>
              <p class="like-count mb-0"><strong>{{artwork.likeCount}}</strong></p>
            </div>
            <div class="card-actions mt-3 w-100 d-flex justify-content-end">
              <button type="button" class="btn btn-danger btn-sm" (click)="handleDelete()">
                <i class="bi bi-trash"></i> Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
