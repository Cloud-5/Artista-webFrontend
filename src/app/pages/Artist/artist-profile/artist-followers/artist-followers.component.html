<div *ngFor="let follower of followers" class="card request-card" style="width: 720px;">
  <div class="d-flex" style="height: 100%;">
    <div class="profile-pic">
      <img [src]="follower.profile_photo_url" alt="Profile Picture" class="rounded-pill" style="width: 78px; height: 78px;">
    </div>
    <div class="card-body">
      <div class="d-flex" style="justify-content: space-between;">
        <div class="d-flex">
          <span style="font-size: large;">{{ follower.name }} |</span>&nbsp;
          <span class="fs-6 fw-medium mr-2 text-secondary"></span>&nbsp;
          <span class="fs-6 fw-medium text-info">{{ follower.country }}</span>
        </div>
      </div>
      <div style="margin: auto; text-align: left;">
        <a href="" class="fs-6">More Details</a>
      </div>
    </div>
    <div class="buttons d-flex">
      <button class="btn btn-danger" (click)="deleteFollower1(follower.id,'artistId')">Remove</button>
    </div>
  </div>
</div>
