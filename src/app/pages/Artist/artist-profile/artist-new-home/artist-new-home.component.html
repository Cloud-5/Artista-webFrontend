<app-navbar></app-navbar>

<div class="header__wrapper">

  <img src="{{userData.banner_img_url}}" alt="Banner Image" style="width: 100%; height: 200px" />
  <div class="cols__container">


    <div class="left__col artist-details" style="width: 450px;">
      <div class="img__container">
        <img [src]="userData.ProfilePhoto" alt={{userData.name}} />
        <span></span>
      </div>
      <h2>{{userData.FName + " " + userData.LName}}</h2>
      <p class="sub-title"><b>{{userData.Location}}</b></p>
      <div class="ratings">
        <span class="fa fa-star star" [ngClass]="{
          'star-active': userData.AverageRating >= 1,
          'star-half': userData.AverageRating >= 0.5 && userData.AverageRating < 1
        }"></span>
        <span class="fa fa-star star" [ngClass]="{
          'star-active': userData.AverageRating >= 2,
          'star-half': userData.AverageRating >= 1.5 && userData.AverageRating < 2
        }"></span>
        <span class="fa fa-star star" [ngClass]="{
          'star-active': userData.AverageRating >= 3,
          'star-half': userData.AverageRating >= 2.5 && userData.AverageRating < 3
        }"></span>
        <span class="fa fa-star star" [ngClass]="{
          'star-active': userData.AverageRating >= 4,
          'star-half': userData.AverageRating >= 3.5 && userData.AverageRating < 4
        }"></span>
        <span class="fa fa-star star" [ngClass]="{
          'star-active': userData.AverageRating >= 5,
          'star-half': userData.AverageRating >= 4.5 && userData.AverageRating < 5
        }"></span>

      </div>
      <ul class="about">
        <li><span>{{userData.NumberOfArtworks}} </span>Creations</li>
        <li><span>{{numberOfFollowers}}</span>Followers</li>
        <li><span>0</span>Purchases</li>
      </ul>
      <!-- <p>{{userData.Description}}</p> -->

      <div class="content">
        <div class="row" style="margin: 0">
          <div class="d-flex" style="justify-content: space-between">

            <button class="btn btn-primary" style="width: 48%" [routerLink]="['/artist/edit', userData.UserID]"> Edit
              profile</button>
            <button type="button" class="btn btn-primary uploadArtworks" routerLink="/upload" style="width: 48%">Upload
              Artwoks</button>
          </div>
          <div class="row" style="margin: 10px 0 0 0">
            <button type="button" class="btn btn-success" (click)="logout()">Log Out</button>

          </div>
        </div>
      </div>
    </div>

    <div class="right__col" style="width: 900px; ">

      <!-- 3Tabs -->


      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <a class="nav-link active" data-bs-toggle="tab" href="#home" aria-selected="true" role="tab">My Creations</a>
        </li>
        <li class="nav-item" role="presentation">
          <a class="nav-link" data-bs-toggle="tab" href="#Followers" aria-selected="false" role="tab"
            tabindex="-1">Followers</a>
        </li>
        <li class="nav-item" role="presentation">
          <a class="nav-link" data-bs-toggle="tab" href="#feedbacks" aria-selected="false" tabindex="-1"
            role="tab">Feedbacks</a>
        </li>
      </ul>

      <div id="myTabContent" class="tab-content">

        <div class="tab-pane fade active show" id="home" role="tabpanel">
          <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
              <form class="d-flex" role="search" style="width: 100%">
                <input class="form-control me-2 rounded-pill border border-primary" type="search" placeholder="Search"
                  aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">
                  Search
                </button>
              </form>
            </div>
          </nav>
          <!-- ////////////////////////////////////////////////////////////creations -->

          <div class="Creations" style="max-height: 1000px; overflow-y: scroll; overflow-x: hidden;">
            <div class="col mb-3" *ngFor="let art of artworks">
              <app-creations [artworks]="art"></app-creations>
            </div>
          </div>

        </div>



 <!-- ////////////////////////////////////////////////////////////Followers -->
        <div class="tab-pane fade" id="Followers" role="tabpanel">
          <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">


              <form class="d-flex" role="search" style="width: 100%">
                <input class="form-control me-2 rounded-pill border border-primary" type="search" placeholder="Search"
                  aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">
                  Search
                </button>
              </form>


             <app-artist-followers></app-artist-followers>

            </div>
          </nav>
        </div>


 <!-- ////////////////////////////////////////////////////////////feedback -->

          <div class="tab-pane fade" id="feedbacks" role="tabpanel">
            <nav class="navbar bg-body-tertiary">
              <div class="container-fluid">
                <form class="d-flex" role="search" style="width: 100%">
                  <input class="form-control me-2 rounded-pill border border-primary" type="search"
                    placeholder="Search" aria-label="Search" />
                  <button class="btn btn-outline-success" type="submit">
                    Search
                  </button>
                </form>

                <app-artist-feedback></app-artist-feedback>
              </div>
            </nav>
          </div>






      </div>
    </div>
  </div>

<app-footer></app-footer>
