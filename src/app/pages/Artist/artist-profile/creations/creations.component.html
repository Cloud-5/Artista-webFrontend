<div class="container">
  <div class="image">

    <img src="{{ artworks.thumbnail_url }}" alt="Artwork Image" />
    <div class="details" (click)="viewArtwork(artworks.artwork_id)">
          <!-- <h2>name</h2> -->
          <!-- <p>{{ artworks.title }}</p> -->
            <!-- Conditionally show the remove button in the top right corner -->
    <!--  -->
    <div class="row justify-content-end" style="margin: 10px;">
      <button *ngIf="artworks.is3D===1"   style="background-color: green; width: 50px; border-radius: 10px; border: none; font-weight: bolder;" >
        3D
       </button>
    </div>



      </div>
      <div class="more">


        <div class="card-body card-content d-flex flex-column align-items-center">
          <div class="card-details d-flex justify-content-between w-100">
            <div class="price">{{artworks.price | currency}}</div>
            <div class="title">{{artworks.title}}</div>
          </div>
          <div class="card-stats d-flex justify-content-between w-100 mt-2">
            <div class="purchase-count">Purchases: {{artworks.purchase_count}} </div>
            <div class="like-count"> Likes:{{artworks.like_count}}</div>
          </div>
          <div class="card-actions mt-3 w-100 d-flex justify-content-end">
            <button type="button" class="btn btn-danger btn-sm" (click)="deleteArtwork(artworks.artwork_id)">
              Delete
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
