<section class="head-title-section">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12 text-center mt-5">
        <h3 class="text-color">Embark on a journey to discover the perfect artist just for you!</h3>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-12 text-center mt-3">
        <div class="input-group">
          <div class="form-outline" data-mdb-input-init>
            <input (input)="searchByKeyword($event)" id="search-input" type="search" class="form-control custom-search" placeholder="Search for Artists" aria-label="Search for Artists" aria-describedby="search-button">
          </div>
          <button id="search-button" type="button" class="btn btn-primary button-search">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>
    </div>
     <br>
    <div class="row column">
     
      <div class="col-md-3 filter">
        <label for="profession-select">Filter by Profession:</label>
        <select id="profession-select" class="form-control" (change)="onProfessionChange($event)">
          <option value="">All Professions</option>
          <option value="Digital Illustrator">Digital Illustrator</option>
          <option value="Pixel Artist">Pixel Artist</option>
          <option value="Animator">Animator</option>
          <!-- Add more options as needed -->
        </select>
      </div>
      <div class="col-md-3 filter">
        <label for="location-select">Filter by Location:</label>
        <select id="location-select" class="form-control" (change)="onLocationChange($event)">
          <option value="">All Locations</option>
          <option value="Earth">Earth</option>
          <option value="Los Angeles">Los Angeles, USA</option>
          <!-- Add more options as needed -->
        </select>
      </div>
      <div class="col-md-3 filter">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select" class="form-control" (change)="onSortChange($event)">
          <option value="">None</option>
          <option value="rating">Rating</option>
          <option value="total_creations">Total Creations</option>
        </select>
      </div>
    </div>

    <div class="container mt-5 mb-3">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
        <div class="col mb-3" *ngFor="let artist of filteredArtists">
          <app-artists [artist]="artist"></app-artists>
        </div>
      </div>
    </div>
  </div>
</section>
