<div *ngFor="let purchase of purchaseHistory" class="card request-card" style="width: 720px;">
  <div class="card-body">
    <div>
      <span class="fw-bold">Purchase ID:</span> {{ purchase.purchase_id }} |
      <span class="fw-bold">Date:</span> {{ purchase.purchase_datetime | date:'yyyy-MM-dd HH:mm' }}
    </div>
    <div class="artworks-list">
      <ng-container *ngIf="purchase.artworks">
        <!-- Parse the JSON string and iterate over the artworks -->
        <div *ngFor="let artwork of parseArtworks(purchase.artworks)" class="artwork-card card">
          <div class="card-body d-flex align-items-center">
            <div class="profile-pic">
              <img [src]="artwork.artwork_image" alt="Artwork">
            </div>
            <div class="artwork-details">
              <div>{{ artwork.artwork_name }}</div>
              <div>{{ artwork.artist_name }}</div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="!purchase.artworks">
        <div>No artworks found for this purchase.</div>
      </ng-container>
    </div>
    <div class="buttons d-flex flex-column align-items-end mt-2">
      <button class="btn btn-danger">Remove</button>
    </div>
  </div>
</div>
