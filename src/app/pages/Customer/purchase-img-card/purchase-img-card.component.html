<div *ngFor="let purchase of purchaseHistory" class="card request-card" style="width: 720px;">
  <div class="d-flex" style="height: 100%;">
    <div class="card-body">
      <div class="d-flex justify-content-between">
        <div>
          <span class="fw-bold">Purchase ID: </span>{{ purchase.purchaseId }} |
          <span class="fw-bold">Date: </span>{{ purchase.purchaseDatetime | date:'yyyy-MM-dd HH:mm' }}
        </div>
      </div>
      <div *ngFor="let artwork of purchase.artworks" style="margin-top: 10px;">
        <div class="d-flex align-items-center">
          <div class="profile-pic">
            <img [src]="artwork.artwork_image" alt="Artwork" style="width: 80px; height: 80px;">
          </div>
          <div style="margin-left: 10px;">
            <div>{{ artwork.artwork_name }}</div>
            <div>{{ artwork.artist_name }}</div>
          </div>
        </div>
      </div>
      <div class="buttons d-flex flex-column align-items-end mt-2">
        <button class="btn btn-success">Comment</button>
        <button class="btn btn-danger">Remove</button>
      </div>
    </div>
  </div>
</div>
