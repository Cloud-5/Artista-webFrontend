<div class="list-group">
  <a *ngFor="let feedback of feedbackList" href="#" class="list-group-item list-group-item-action">
    <div class="d-flex w-100 justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <img src="{{feedback.profile_photo_url}}" alt="Profile Picture" class="rounded-pill profile-pic">
        <h5 class="mb-1 ml-2">{{feedback.fName}} {{feedback.LName}}</h5>
      </div>
      <small>{{ feedback.timestamp | date:'yyyy-MM-dd' }}</small>
    </div>
    <p class="mb-1">{{ feedback.feedback_content }}</p>
  </a>
</div>
