<div class="container pt-3">
  <h1>Edit Profile</h1>
  <br />
  <div class="row">
    <div class="col">
      <p>Edit your information and click save to make changes.</p>
    </div>
    <div class="col" style="text-align: end">
      <a routerLink="/customer-profile-gallery">
        <button type="button" class="btn btn-primary">View Profile</button>
      </a>
    </div>
  </div>

  <form
    #editCustomerProfileForm="ngForm"
    (ngSubmit)="editDetails(editCustomerProfileForm)"
    ngModelOptions="{standalone: true}"
  >
    <div class="form-container">
      <div class="form-section">
        <h2>Banner Image</h2>
        <div class="row mb-3">
          <div class="col-md-4">
            <div class="banner-image-box rounded border d-flex justify-content-center align-items-center"
              style="width:1060px; height: 200px; overflow: hidden; background-color: #f8f9fa; cursor: pointer;"
              (click)="bannerFileInput.click()">
              <img *ngIf="customer.banner_img_url" src="{{customer.banner_img_url}}" alt="Banner Image" class="img-thumbnail"
                style="width:1060px; height: 200px; object-fit: cover;" />
              <div *ngIf="!customer.banner_img_url" class="empty-box text-center">
                <i class="bi bi-camera-fill fs-1" style="width: 40px; height: 40px;"></i>
                <p class="m-0">Upload Image</p>
              </div>
            </div>
            <input #bannerFileInput type="file" class="form-control visually-hidden" id="banner-image" name="banner-image"
              (change)="onBannerFileSelected($event)" />
            <br>
            <button (click)="uploadBannerImage('Customer', 'profilePicture')" class="btn btn-primary" style="font-size: 12px;" type="button">Upload Image
            </button>
            <br>
            <button *ngIf="customer.banner_img_url" (click)="removeBannerImage()" class="btn btn-danger"
              style="margin-top: 5px; font-size: 12px; background-color: rgb(132, 135, 138); border-color:rgb(132, 135, 138) ;" type="button">Remove Image </button>
          </div>
        </div>
      </div>
      <div class="form-section">
        <div class="row mb-3">
          <h2>Profile Image</h2>
<div class="col-md-4">
  <div class="profile-image-box rounded-circle border d-flex justify-content-center align-items-center"
  style="width:150px; height: 150px; overflow: hidden;
   background-color: #f8f9fa; cursor: pointer;" (click)="fileInput.click()">
    <img
      *ngIf="customer.profile_photo_url"
      src="{{ customer.profile_photo_url }}"
      alt="Profile Photo"
      class="img-thumbnail"
      style="width: 150px; height: 150px; object-fit: cover;"
    />
    <div *ngIf="!customer.profile_photo_url" class="empty-box text-center">
      <i class="bi bi-camera-fill fs-1" style="width: 40px; height: 40px;"></i>
      <p class="m-0">Upload Image</p>
    </div>
  </div>
  <input
    #fileInput
    type="file"
    class="form-control visually-hidden"
    id="profile-image"
    name="profile-image"
    (change)="onFileSelected($event)"
  />
  <br>
  <button
    (click)="newImageUpload('Customer', 'profilePicture')"
    class="btn btn-primary"
    type="button"
    style="margin-left:15px; font-size: 12px;"
  >
    Upload Image
  </button>
  <br>
  <button
    *ngIf="customer.profile_photo_url"
    (click)="removeExistingImage()"
    class="btn btn-danger"
    style="margin-top: 5px; margin-left: 15px; font-size: 12px; background-color: rgb(132, 135, 138);border-color:rgb(132, 135, 138) ;"
    type="button"
  >
    Remove Image
  </button>
</div>
   <div class="col-md-8">
            <div class="form-section">
              <div class="row mb-3">
                <h2>Basic Information</h2>
                <div class="col-sm-6">
                  <label for="first-name" class="form-label">First Name:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="first-name"
                    [(ngModel)]="customer.fName"
                    name="first-name"
                    required
                    #newfname="ngModel"
                  />
                  <div
                    *ngIf="
                      newfname.invalid && (newfname.dirty || newfname.touched)
                    "
                    class="alert"
                  >
                    <div
                      *ngIf="newfname.errors?.['required']"
                      class="text-danger lead fs-6"
                    >
                      First Name is required
                    </div>
                  </div>
                </div>
                <div class="col-sm-6">
                  <label for="last-name" class="form-label">Last Name:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="last-name"
                    [(ngModel)]="customer.LName"
                    name="last-name"
                    required
                    #newlname="ngModel"
                  />
                  <div
                    *ngIf="
                      newlname.invalid && (newlname.dirty || newlname.touched)
                    "
                    class="alert"
                  >
                    <div
                      *ngIf="newlname.errors?.['required']"
                      class="text-danger lead fs-6"
                    >
                      Last Name is required
                    </div>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <textarea
                  id="description"
                  class="form-control"
                  rows="4"
                  [(ngModel)]="customer.description"
                  name="description"
                  required
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Regional Details</h2>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="country" class="form-label">Location:</label>
            <input
              type="text"
              class="form-control"
              id="country"
              required
              [(ngModel)]="customer.location"
              name="country"
            />
          </div>
          <div class="col-md-6">
            <label for="phone-number" class="form-label">Phone Number:</label>
            <input
              type="tel"
              class="form-control"
              id="phone-number"
              [(ngModel)]="customer.phone"
              name="phone-number"
            />
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-center mt-5 mb-3">
        <div style="padding-right: 400px">
          <button type="button" class="btn btn-secondary" (click)="discardChanges()">
            Discard Profile
          </button>
        </div>
        <div style="padding-left: 400px">
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
      </div>
    </div>
  </form>

  <div class ="changepswd" style="padding: 80px;">
  <form (ngSubmit)="changePassword()">
    <div class="form-section1" style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; margin-bottom: 20px;">
      <h2>Change Password</h2>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
        </div>
        <div class="col-md-6">
          <label for="old-password" class="form-label">Old Password:</label>
          <input type="password" class="form-control" [(ngModel)]="oldPassword" name="old-password" required />
        </div>
        <div class="col-md-6">
          <label for="new-password" class="form-label">New Password:</label>
          <input type="password" class="form-control" [(ngModel)]="newPassword" name="new-password" required />
        </div>
        <div class="col-md-6">
          <label for="confirm-password" class="form-label">Confirm Password:</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirm-password" required />
        </div>
      </div>
    </div>
    <div style="padding-left: 400px">
      <button type="submit" class="btn btn-primary" style="margin-left: 550px;">Change Password</button>
    </div>
  </form>


</div>
</div>
