<div *ngFor="let profile of filteredArtists" class="card request-card">
  <div class="d-flex" style="height: 100%;">
    <div class="profile-pic" style="margin-left:20px ;">
      <img src="{{profile.profile_photo_url}}" alt="Profile Picture" class="rounded-pill" style="width: 120px; height: 120px;  border: 5px solid #fff;">
    </div>
    <div class="card-body" style="margin-left: 30px;">
      <div class="d-flex" style="justify-content: space-between;">
        <div class="d-flex">
          <span style="font-size: large;">{{profile.fName}} {{profile.LName}} |</span>&nbsp;
          <span class="fs-6 fw-medium mr-2 text-secondary" style="margin-right:0;">{{ profile.profession }} |</span>&nbsp;
          <span style="font-size:16px; color:rgb(112, 112, 185);">{{ profile.location }}</span>
        </div>
      </div>
      <div style="margin: auto; text-align: left;">
        <a class="fs-6" (click)="goToPortfolio(profile.user_id)" style="color:rgb(105, 105, 237)"> <u> More Details </u></a>
      </div>
    </div>
    <div class="buttons d-flex">
      <button class="btn btn-x" type="button" style="color:#fff; background-color: #0f4d55; border-color: #fff;" (click)="unfollow(profile.user_id.toString())">Unfollow</button>
    </div>
  </div>
</div>
