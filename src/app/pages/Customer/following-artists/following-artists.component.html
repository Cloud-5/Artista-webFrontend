<div *ngFor="let profile of filteredArtists" class="card request-card" style="width: 760px;">
  <div class="d-flex" style="height: 100%;">
    <div class="profile-pic">
      <img src="{{profile.profile_photo_url}}" alt="Profile Picture" class="rounded-pill" style="width: 78px; height: 78px;">
    </div>
    <div class="card-body">
      <div class="d-flex" style="justify-content: space-between;">
        <div class="d-flex">
          <span style="font-size: large;">{{profile.fName}} {{profile.LName}} |</span>&nbsp;
          <span class="fs-6 fw-medium mr-2 text-secondary">{{ profile.profession }} |</span>&nbsp;
          <span class="fs-6 fw-medium text-info">{{ profile.location }}</span>
        </div>
      </div>
      <div style="margin: auto; text-align: left;">
        <a class="fs-6" (click)="goToPortfolio(profile.user_id)"> More Details </a>
      </div>
    </div>
    <div class="buttons d-flex">
      <button class="btn btn-danger" type="button" (click)="unfollow(profile.user_id.toString())">Unfollow</button>
    </div>
  </div>
</div>
