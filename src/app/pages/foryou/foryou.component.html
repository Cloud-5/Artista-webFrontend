<section class="head-title-section">
    <div class="container-fluid">
        <div class="row ">
            <div class="col-md-12 text-center mt-5">
                <div class="row justify-content-center">
                  <div class="col-md-8 text-center">
                    <div class="position-fixed top-2 end-0 p-3 z-custom-button">
                        <button type="button" class="btn shadow btn-primary btn-lg custom-button"  routerLink="/categories" >
                            Personalize
                            <i class="bi bi-sliders"></i>
                        </button>                    
                    </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container mt-5 mb-3 ">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 card-index" >
                <div class="col mb-3" *ngFor="let art of artsData" >
                    <app-arts [art]="art"></app-arts>                
                </div>
            </div>
        </div>
    </div>
</section>
