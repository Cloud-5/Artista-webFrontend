<section class="head-title-section section-margin">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12 text-center mt-5">
        <h3 class="text-color">Your cart items await you, just a step away from making them yours.</h3>
      </div>
    </div>

    <div class="row">
      <!-- Left side with cart items -->
      <div *ngIf="cartItems">
        <div class="col-md-9">
          <div class="d-flex flex-wrap " *ngFor="let getCartDetail of cartItems">
            <app-cart-card [cartItem]="getCartDetail"></app-cart-card>
          </div>
        </div>
      </div>

      <!-- Right side with card summary -->
      <div class="col-md-3 summary-card position-fixed" style="right: 60px; top: 153px; ">
        <div class="d-flex justify-content-center align-items-center flex-column h-100">
          <div class="card shadow">
            <div class="card-body">
              <h5 class="card-title">Cart Summary</h5>
              <div class="row">
                <div class="col-md-7">
                  <p class="card-text">Total Quantity : </p>
                </div>
                <div class="col-md-5">
                  <p class="card-text">{{ totalQuantity }} </p>
                </div>
              </div>
              <div class="row">
                <div class="col-md-7">
                  <p class="card-text">Sub Total : </p>
                </div>
                <div class="col-md-5">
                  <p class="card-text">{{ subTotal | currency:'USD':'symbol':'1.2-2' }} </p>
                </div>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-success btn-change mt-3 shadow"  (click)="checkout()">Checkout</button>
          <button
            type="button" class="btn btn-danger btn-customize mt-3 shadow"
            (click)="removeAll()">
            Clear Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
]
